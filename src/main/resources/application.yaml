spring:
  datasource:
    url: jdbc:h2:mem:test
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true

  # Desativa o Flyway no ambiente H2 para evitar conflito de dialetos SQL
  flyway:
    enabled: false
